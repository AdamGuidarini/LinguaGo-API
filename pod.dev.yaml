apiVersion: v1
kind: Pod
metadata:
  name: linguago-api
spec:
  containers:
    - name: app
      image: localhost/linguago-api-dev:latest
      ports:
        - containerPort: 3000
          hostPort: 3000
      env:
        - name: APY_URL
          value: http://localhost:2737
        - name: LT_URL
          value: http://localhost:5000
        # Effectively disable throttling in dev while keeping the limiter
        # middleware (and its RateLimit-* headers) exercised.
        - name: GENERAL_RATE_LIMIT
          value: "1000000"
        - name: TRANSLATION_RATE_LIMIT
          value: "1000000"
      volumeMounts:
        - name: app-src
          mountPath: /app/src

    - name: apy
      image: localhost/linguago-apy:latest
      resources:
        limits:
          memory: 2Gi
      env:
        - name: LC_ALL
          value: C.UTF-8
        - name: LANG
          value: C.UTF-8
      

    - name: lt
      image: localhost/linguago-lt:latest
      resources:
        limits:
          memory: 8Gi
      volumeMounts:
        - name: lt-data
          mountPath: /home/libretranslate/.local

  volumes:
    - name: app-src
      hostPath:
        path: ~/Projects/LinguaGo-Server/app/src
        type: Directory